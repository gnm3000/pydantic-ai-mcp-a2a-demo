[project]
name = "experiment-mcp"
version = "0.1.0"
description = "Educational market intelligence MCP server and agent demos"
readme = "README.md"
authors = [
    { name = "German Montenegro", email = "gnm3000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp[apps]>=4.0.10,<5",
    "fastmcp-tasks>=4.0.10,<5",
    "logfire>=5.1.1",
    "pydantic-ai-slim[ag-ui,mcp,openrouter]>=2.54.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.2",
    "yfinance>=1.7.0",
    "a2a-sdk[http-server]>=1.0.0",
]

[project.scripts]
experiment-mcp = "experiment_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=experiment_mcp --cov-report=term-missing --cov-fail-under=90"
